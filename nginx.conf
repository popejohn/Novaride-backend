# Nginx Configuration for Nova Crest Backend
# This file should be placed in /etc/nginx/sites-available/nova-backend (Linux)
# Then symlink to /etc/nginx/sites-enabled/nova-backend
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream backend servers
upstream nova_backend {
    # For single instance
    server localhost:5001 max_fails=3 fail_timeout=30s;
    
    # For multiple instances (uncomment if using multiple PM2 instances)
    # server localhost:5001;
    # server localhost:5002;
    # server localhost:5003;
    
    keepalive 64;
}

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.novacrest.com www.api.novacrest.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

# HTTPS Server - Main API & WebSocket
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.novacrest.com www.api.novacrest.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.novacrest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.novacrest.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # Logging
    access_log /var/log/nginx/nova-backend-access.log combined;
    error_log /var/log/nginx/nova-backend-error.log warn;
    
    # Max upload size
    client_max_body_size 50M;
    
    # Connection timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # ============================================
    # API Routes
    # ============================================
    location /api/ {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Disable buffering for real-time responses
        proxy_buffering off;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    
    # ============================================
    # WebSocket / Socket.IO
    # ============================================
    location /socket.io {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        
        # Critical for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for real-time events
        proxy_buffering off;
        
        # Long timeout for persistent connections
        proxy_read_timeout 3600s;
        proxy_connect_timeout 7d;
        proxy_send_timeout 3600s;
    }
    
    # ============================================
    # Health Check Endpoint
    # ============================================
    location /health {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # ============================================
    # Static Frontend Files
    # ============================================
    location / {
        root /var/www/nova-frontend/dist;
        
        # Try file, then directory, then fallback to index.html for SPA
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Don't cache HTML files
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # ============================================
    # Deny Access to Sensitive Files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================
    # Custom Error Pages
    # ============================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Rate Limiting (Optional - for DDoS protection)
# Uncomment to enable
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=socket_limit:10m rate=50r/s;
# 
# Then add these to the respective location blocks:
# limit_req zone=api_limit burst=20 nodelay;
# limit_req zone=socket_limit burst=100 nodelay;
